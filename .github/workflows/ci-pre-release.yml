name: Criar nova release automaticamente

on:
  push:
    branches:
      - develop

jobs:
  criar-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Obter o próximo número de release
        id: next_release
        run: |
          EXISTING=$(git ls-remote --heads origin "refs/heads/release/*" | awk -F'/' '{print $NF}' | sort -V)
          LAST=$(echo "$EXISTING" | tail -n1 | sed 's/release\///')
          NEXT=$((LAST + 1))
          echo "Última release encontrada: $LAST"
          echo "Próxima será release/$NEXT"
          echo "next_release=release/$NEXT" >> $GITHUB_OUTPUT

      - name: Criar e subir nova branch release
        run: |
          git fetch origin
          git checkout -b ${{ steps.next_release.outputs.next_release }}
          git push origin ${{ steps.next_release.outputs.next_release }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
